[package]
name = "devmanager"
version = "0.2.8"
description = "Local development environment manager"
authors = ["Jamrsx"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.0", default-features = false, features = ["disk"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
futures-util = { version = "0.3.34", default-features = false }
sha2 = "0.11.1"
md-5 = "0.11.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
sha1 = "0.11.0"
portable-pty = "0.9.0"
mysql = { version = "28.0.4", features = ["native-tls"] }
getrandom = "0.4.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
