      <circle class="d1 a" cx="490" cy="906" r="13"/><circle class="d2 a" cx="538" cy="906" r="13"/><circle class="d3 a" cx="586" cy="906" r="13"/>
    </g>
    <g class="x x-think">
      <g class="cloud a">
        <circle cx="772" cy="258" r="9" fill="#12294A" stroke="#3D8CFF" stroke-width="5"/>
        <circle cx="812" cy="214" r="14" fill="#12294A" stroke="#3D8CFF" stroke-width="5"/>
