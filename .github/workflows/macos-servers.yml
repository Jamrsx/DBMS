# Builds NexDB's server programs for Macs: every version the catalog offers, for Intel and
# Apple Silicon, all running on macOS 12 and newer. Plan: docs/macos-port.md (Phase 2).
#
# Starts only by hand. Builds are long (MySQL 30-60 minutes per chip) and macOS minutes cost
# about 10x Linux minutes on a private repository; in a public repository they are free.
#
# Result: one artifact per program and chip. Publish the .tar.xz files (for example as a
# release in Jamrsx/nexdb-releases), then run:
#   python scripts/macos-servers/catalog.py add <folder with the files> <release download URL>

name: NexDB macOS servers

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Programs to build, comma separated"
        default: "redis,mailpit,node,postgres,php,apache,nginx,mysql"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        program: [redis, mailpit, node, postgres, php, apache, nginx, mysql]
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Wanted?
        id: want
        run: |
          case ",${{ inputs.programs }}," in
            *",${{ matrix.program }},"*) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not selected; skipping." ;;
          esac

      - uses: actions/checkout@v4
        if: steps.want.outputs.yes == 'true'

      - name: Build tools
        if: steps.want.outputs.yes == 'true'
        run: brew install cmake ninja bison pkg-config autoconf automake libtool

      - name: Build every catalog version
        if: steps.want.outputs.yes == 'true'
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          for v in $(python3 scripts/macos-servers/catalog.py versions ${{ matrix.program }}); do
            echo "::group::${{ matrix.program }} $v"
            bash scripts/macos-servers/build.sh ${{ matrix.program }} "$v"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.yes == 'true'
        with:
          name: ${{ matrix.program }}-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            out/*.tar.xz
            out/*.tar.xz.sha256
