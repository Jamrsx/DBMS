# Quick check that the Rust code builds and its tests pass on macOS, for both Mac chips.
# Much shorter than a full .dmg build. Plan: docs/macos-port.md
#
# Starts by hand (Actions -> "NexDB macOS check" -> Run workflow), or on each push to the
# macos-port branch (GitHub only offers "Run workflow" once the file is on the default branch).

name: NexDB macOS check

on:
  workflow_dispatch:
  push:
    branches: [macos-port]
    paths-ignore: ["docs/**", ".github/workflows/macos-app.yml"]

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Rust for both Mac chips
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Tauri needs the frontend folder to exist at compile time; an empty page is enough here.
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html><title>NexDB</title>' > ../dist/index.html

      - name: Type-check for Intel Macs
        run: cargo check --all-targets --target x86_64-apple-darwin

      - name: Tests on Apple Silicon
        run: cargo test --lib
